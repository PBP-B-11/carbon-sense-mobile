format_version: '17'
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: flutter

meta:
  bitrise.io:
    stack: ubuntu-noble-24.04-bitrise-2025-android

workflows:
  android_debug:
    steps:
      - git-clone@8: {}
      - flutter-installer@1.1.0:
          inputs:
            - version: '3.47.9'
      - script@1:
          title: Build Android debug APK
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -euo pipefail
                cd "$BITRISE_SOURCE_DIR"
                flutter pub get --enforce-lockfile
                flutter build apk --debug --no-pub
                cp build/app/outputs/flutter-apk/app-debug.apk "$BITRISE_DEPLOY_DIR/app-debug.apk"
      - deploy-to-bitrise-io@2:
          is_always_run: false
          inputs:
            - is_enable_public_page: 'false'
